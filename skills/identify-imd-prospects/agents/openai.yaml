name: identify-imd-prospects
version: "1.1"
description: >
  Identify and prioritize evidence-grounded organizations for human
  qualification for an Institutional Memory Diagnostic using the validated
  V1.1 P-A-C-R methodology and human-gated qualitative tiering.

default_prompt: >
  Apply identify-imd-prospects V1.1 to the supplied research universe.
  Preserve provenance, distinguish facts from inference, hypotheses and
  unknowns, reconstruct Problem-Awareness-Corrective Action-
  Recurrence/Persistence, apply the current operating-boundary gate,
  execute required contradiction searches, enforce the completion gate,
  use qualitative tiers without numerical scoring, identify sponsor roles
  only, and route Strong status to human review.
