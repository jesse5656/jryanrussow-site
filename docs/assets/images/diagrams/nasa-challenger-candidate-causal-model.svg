<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 760"
     role="img"
     aria-labelledby="title desc">

  <title id="title">NASA Challenger Candidate Technical and Organizational Causal Model</title>

  <desc id="desc">
    A candidate causal model organizing possible technical risk, historical
    observations, organizational pressures, communication, decision processes,
    launch conditions, and accident outcome. All causal links require evidence.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10"
            refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#123b69"/>
    </marker>

    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #123b69; }
      .subtitle { font: 14px Arial, sans-serif; fill: #66788a; }
      .node { fill: #ffffff; stroke: #9fb0c0; stroke-width: 1.5; rx: 6; }
      .candidate { fill: #fffaf0; stroke: #c48a18; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 6; }
      .outcome { fill: #f4f6f8; stroke: #123b69; stroke-width: 2; rx: 6; }
      .nodeTitle { font: 700 16px Arial, sans-serif; fill: #123b69; }
      .body { font: 13px Arial, sans-serif; fill: #405163; }
      .warning { font: 700 11px Arial, sans-serif; letter-spacing: 1.2px; fill: #8a6a16; }
      .line { fill: none; stroke: #123b69; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="65" y="52" class="title">Candidate Technical + Organizational Causal Model</text>
  <text x="65" y="80" class="subtitle">
    Working hypothesis structure · no causal link is established by this diagram
  </text>

  <rect x="70" y="145" width="275" height="105" class="candidate"/>
  <text x="95" y="174" class="warning">EVIDENCE REQUIRED</text>
  <text x="95" y="204" class="nodeTitle">Technical Risk Conditions</text>
  <text x="95" y="230" class="body">Candidate technical factors under investigation</text>

  <rect x="70" y="330" width="275" height="105" class="candidate"/>
  <text x="95" y="359" class="warning">EVIDENCE REQUIRED</text>
  <text x="95" y="389" class="nodeTitle">Historical Experience</text>
  <text x="95" y="415" class="body">Prior anomalies, observations, lessons</text>

  <rect x="505" y="145" width="275" height="105" class="candidate"/>
  <text x="530" y="174" class="warning">EVIDENCE REQUIRED</text>
  <text x="530" y="204" class="nodeTitle">Organizational Pressure</text>
  <text x="530" y="230" class="body">Schedule, mission, institutional context</text>

  <rect x="505" y="330" width="275" height="105" class="candidate"/>
  <text x="530" y="359" class="warning">EVIDENCE REQUIRED</text>
  <text x="530" y="389" class="nodeTitle">Communication / Escalation</text>
  <text x="530" y="415" class="body">How risk information moved or changed</text>

  <rect x="920" y="235" width="275" height="115" class="candidate"/>
  <text x="945" y="264" class="warning">EVIDENCE REQUIRED</text>
  <text x="945" y="294" class="nodeTitle">Launch Decision Process</text>
  <text x="945" y="320" class="body">Interaction of knowledge, authority, and judgment</text>

  <rect x="920" y="470" width="275" height="110" class="outcome"/>
  <text x="945" y="507" class="nodeTitle">Challenger Accident</text>
  <text x="945" y="535" class="body">Historical outcome</text>
  <text x="945" y="558" class="body">Causal interpretation remains subject to evidence</text>

  <path d="M345 198 L505 198" class="line"/>
  <path d="M345 383 L505 383" class="line"/>
  <path d="M780 198 C850 198 850 292 920 292" class="line"/>
  <path d="M780 383 C850 383 850 310 920 310" class="line"/>
  <path d="M1058 350 L1058 470" class="line"/>
  <path d="M208 250 C208 285 600 285 600 330" class="line"/>

  <rect x="70" y="610" width="1125" height="85" class="node"/>
  <text x="95" y="642" class="nodeTitle">Validation Rule</text>
  <text x="95" y="671" class="body">
    Each node and connector is a candidate relationship. Evidence may support, modify, split, reverse, or eliminate any part of this model.
  </text>

  <text x="70" y="730" class="subtitle">
    STATUS: CANDIDATE CAUSAL MODEL — NOT AN INSTITUTE FINDING.
  </text>

</svg>
